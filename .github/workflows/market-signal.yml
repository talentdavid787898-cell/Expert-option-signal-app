name: Live Market Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live market signal
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.TWELVE_DATA_API_KEY;

          if (!API_KEY) {
            throw new Error("TWELVE_DATA_API_KEY secret is missing.");
          }

          const symbol = "EUR/USD";
          const interval = "1min";
          const outputsize = 100;

          const url =
            "https://api.twelvedata.com/time_series" +
            "?symbol=" + encodeURIComponent(symbol) +
            "&interval=" + interval +
            "&outputsize=" + outputsize +
            "&timezone=UTC" +
            "&apikey=" + encodeURIComponent(API_KEY);

          console.log("Requesting latest EUR/USD market data...");

          const response = await fetch(url);
          const data = await response.json();

          if (!response.ok || data.status === "error") {
            throw new Error(
              "Twelve Data error: " +
              (data.message || response.status)
            );
          }

          if (!Array.isArray(data.values) || data.values.length < 30) {
            throw new Error("Not enough market data returned.");
          }

          // Twelve Data returns newest first.
          const candles = data.values
            .map(v => ({
              datetime: v.datetime,
              open: Number(v.open),
              high: Number(v.high),
              low: Number(v.low),
              close: Number(v.close)
            }))
            .reverse();

          const closes = candles.map(c => c.close);

          function sma(values, period) {
            if (values.length < period) return null;

            const slice = values.slice(-period);

            return slice.reduce((a, b) => a + b, 0) / period;
          }

          function ema(values, period) {
            if (values.length < period) return null;

            const multiplier = 2 / (period + 1);

            let average =
              values
                .slice(0, period)
                .reduce((a, b) => a + b, 0) / period;

            for (let i = period; i < values.length; i++) {
              average =
                (values[i] - average) * multiplier + average;
            }

            return average;
          }

          function rsi(values, period = 14) {
            if (values.length <= period) return null;

            let gains = 0;
            let losses = 0;

            for (let i = 1; i <= period; i++) {
              const change = values[i] - values[i - 1];

              if (change > 0) {
                gains += change;
              } else {
                losses += Math.abs(change);
              }
            }

            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < values.length; i++) {
              const change = values[i] - values[i - 1];

              const gain = Math.max(change, 0);
              const loss = Math.max(-change, 0);

              avgGain =
                ((avgGain * (period - 1)) + gain) / period;

              avgLoss =
                ((avgLoss * (period - 1)) + loss) / period;
            }

            if (avgLoss === 0) return 100;

            const rs = avgGain / avgLoss;

            return 100 - (100 / (1 + rs));
          }

          const price = closes[closes.length - 1];

          const ema9 = ema(closes, 9);
          const ema21 = ema(closes, 21);
          const rsi14 = rsi(closes, 14);

          const previousPrice = closes[closes.length - 2];

          const momentum =
            ((price - previousPrice) / previousPrice) * 100;

          let score = 0;

          // Trend
          if (ema9 > ema21) score += 2;
          if (ema9 < ema21) score -= 2;

          // RSI
          if (rsi14 >= 55 && rsi14 <= 70) score += 1;
          if (rsi14 <= 45 && rsi14 >= 30) score -= 1;

          // Momentum
          if (momentum > 0) score += 1;
          if (momentum < 0) score -= 1;

          let signal = "WAIT";

          if (score >= 2) signal = "CALL";
          if (score <= -2) signal = "PUT";

          // Confidence is a strength score, NOT a win probability.
          let confidence = 50 + Math.min(Math.abs(score) * 8, 32);

          if (signal === "WAIT") {
            confidence = 50;
          }

          confidence = Math.round(confidence);

          const result = {
            status: "ok",
            symbol,
            interval,
            signal,
            confidence,
            price: Number(price.toFixed(5)),
            rsi: Number(rsi14.toFixed(2)),
            ema9: Number(ema9.toFixed(6)),
            ema21: Number(ema21.toFixed(6)),
            momentum: Number(momentum.toFixed(4)),
            candle: candles[candles.length - 1].datetime,
            updatedAt: new Date().toISOString(),
            provider: "Twelve Data",
            disclaimer:
              "Statistical analysis only. Not financial advice and not a guaranteed prediction."
          };

          fs.writeFileSync(
            "signal.json",
            JSON.stringify(result, null, 2)
          );

          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Publish signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal.json

          if git diff --cached --quiet; then
            echo "No signal change to commit."
          else
            git commit -m "Update live market signal"
            git push
          fi
