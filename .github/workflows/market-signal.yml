name: Live Market Signal

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  generate-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live market signal
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const API_KEY = process.env.TWELVE_DATA_API_KEY;

          if (!API_KEY) {
            throw new Error("TWELVE_DATA_API_KEY secret is missing.");
          }

          const symbol = "EUR/USD";
          const interval = "1min";
          const outputsize = 100;

          const url =
            "https://api.twelvedata.com/time_series?" +
            new URLSearchParams({
              symbol,
              interval,
              outputsize: String(outputsize),
              apikey: API_KEY
            });

          function sma(values, period) {
            if (values.length < period) return null;

            const slice = values.slice(-period);
            return slice.reduce((a, b) => a + b, 0) / period;
          }

          function ema(values, period) {
            if (values.length < period) return null;

            const multiplier = 2 / (period + 1);

            let average =
              values.slice(0, period).reduce((a, b) => a + b, 0) / period;

            for (let i = period; i < values.length; i++) {
              average =
                (values[i] - average) * multiplier + average;
            }

            return average;
          }

          function rsi(values, period = 14) {
            if (values.length <= period) return null;

            let gains = 0;
            let losses = 0;

            for (let i = 1; i <= period; i++) {
              const change = values[i] - values[i - 1];

              if (change >= 0) {
                gains += change;
              } else {
                losses += Math.abs(change);
              }
            }

            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < values.length; i++) {
              const change = values[i] - values[i - 1];

              const gain = change > 0 ? change : 0;
              const loss = change < 0 ? Math.abs(change) : 0;

              avgGain = ((avgGain * (period - 1)) + gain) / period;
              avgLoss = ((avgLoss * (period - 1)) + loss) / period;
            }

            if (avgLoss === 0) return 100;

            const rs = avgGain / avgLoss;

            return 100 - (100 / (1 + rs));
          }

          async function main() {
            console.log("Requesting live market data...");

            const response = await fetch(url);

            if (!response.ok) {
              throw new Error(
                `Twelve Data HTTP error: ${response.status}`
              );
            }

            const data = await response.json();

            if (data.status === "error") {
              throw new Error(
                data.message || "Twelve Data returned an error."
              );
            }

            if (!Array.isArray(data.values) || data.values.length < 30) {
              throw new Error("Not enough market data returned.");
            }

            // Twelve Data normally returns newest first.
            const candles = [...data.values].reverse();

            const closes = candles.map(c => Number(c.close));
            const latest = candles[candles.length - 1];

            const price = Number(latest.close);

            const ema9 = ema(closes, 9);
            const ema21 = ema(closes, 21);
            const rsi14 = rsi(closes, 14);

            const recent = closes.slice(-6);
            const oldPrice = recent[0];
            const momentumPercent =
              ((price - oldPrice) / oldPrice) * 100;

            let score = 0;

            // Trend
            if (ema9 > ema21) score += 2;
            if (ema9 < ema21) score -= 2;

            // RSI
            if (rsi14 > 55 && rsi14 < 70) score += 1;
            if (rsi14 < 45 && rsi14 > 30) score -= 1;

            // Momentum
            if (momentumPercent > 0.01) score += 1;
            if (momentumPercent < -0.01) score -= 1;

            let signal = "WAIT";

            if (score >= 2) {
              signal = "CALL";
            } else if (score <= -2) {
              signal = "PUT";
            }

            let confidence;

            if (signal === "WAIT") {
              confidence = 50 + Math.abs(score) * 3;
            } else {
              confidence = 55 + Math.abs(score) * 7;
            }

            confidence = Math.min(85, Math.max(50, confidence));

            const result = {
              success: true,
              source: "Twelve Data",
              symbol,
              interval,
              signal,
              confidence,
              price,
              ema9: Number(ema9.toFixed(6)),
              ema21: Number(ema21.toFixed(6)),
              rsi14: Number(rsi14.toFixed(2)),
              momentumPercent: Number(momentumPercent.toFixed(4)),
              candleTime: latest.datetime,
              generatedAt: new Date().toISOString(),
              methodology: "EMA trend + RSI + short-term momentum",
              warning:
                "Market analysis is probabilistic and is not a guaranteed prediction."
            };

            fs.writeFileSync(
              "signal.json",
              JSON.stringify(result, null, 2)
            );

            console.log(JSON.stringify(result, null, 2));
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish signal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal.json

          if git diff --cached --quiet; then
            echo "No signal changes to publish."
          else
            git commit -m "Update live market signal"
            git push
          fi
