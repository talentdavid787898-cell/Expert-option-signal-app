<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Expert Option Signal App</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }

    .app {
      width: 92%;
      max-width: 500px;
      margin: auto;
      padding: 35px 0;
      text-align: center;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .panel {
      background: #1d1d1d;
      border-radius: 22px;
      padding: 25px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      text-align: left;
      color: #bbb;
      font-size: 18px;
      margin-bottom: 10px;
    }

    select,
    button {
      width: 100%;
      padding: 18px;
      border: 0;
      border-radius: 15px;
      font-size: 18px;
      margin-bottom: 20px;
    }

    select {
      background: #292929;
      color: white;
    }

    button {
      background: #2196f3;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .status {
      color: #aaa;
      font-size: 16px;
    }

    .signal-card {
      background: #222;
      border-radius: 22px;
      padding: 30px 20px;
    }

    .signal {
      font-size: 54px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .call {
      color: #00d26a;
    }

    .put {
      color: #ff5b5b;
    }

    .wait {
      color: #ffc107;
    }

    .confidence {
      font-size: 23px;
      margin-bottom: 25px;
    }

    .info {
      color: #aaa;
      font-size: 17px;
      line-height: 1.8;
    }

    .warning {
      color: #888;
      font-size: 13px;
      margin-top: 25px;
      line-height: 1.5;
    }

    .updated {
      color: #777;
      font-size: 12px;
      margin-top: 15px;
    }

  </style>
</head>

<body>

  <div class="app">

    <h1>Expert Option Signal App</h1>

    <div class="subtitle">
      Live Market Signal Analysis
    </div>

    <div class="panel">

      <label>Market</label>

      <select id="market">
        <option value="EUR/USD">
          EUR/USD
        </option>
      </select>

      <label>Analysis</label>

      <select id="interval">
        <option value="1min">
          1 Minute
        </option>
      </select>

      <button onclick="getSignal()">
        GET LIVE SIGNAL
      </button>

      <div class="status" id="status">
        Loading latest market data...
      </div>

    </div>

    <div class="signal-card">

      <div
        id="signal"
        class="signal wait"
      >
        WAIT
      </div>

      <div
        id="confidence"
        class="confidence"
      >
        Confidence: --
      </div>

      <div
        id="info"
        class="info"
      >
        Waiting for live market analysis...
      </div>

      <div class="warning">
        Market data is provided by Twelve Data.
        Signals are statistical analysis, not guaranteed predictions.
        Do not risk money you cannot afford to lose.
      </div>

      <div
        id="updated"
        class="updated"
      >
      </div>

    </div>

  </div>

  <script>

    async function getSignal() {

      const status =
        document.getElementById("status");

      const signalElement =
        document.getElementById("signal");

      const confidenceElement =
        document.getElementById("confidence");

      const infoElement =
        document.getElementById("info");

      const updatedElement =
        document.getElementById("updated");

      status.textContent =
        "Getting latest market analysis...";

      try {

        const response = await fetch(
          "signal.json?t=" + Date.now(),
          {
            cache: "no-store"
          }
        );

        if (!response.ok) {
          throw new Error(
            "Signal file is not available yet."
          );
        }

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            "Signal generation failed."
          );
        }

        signalElement.textContent =
          data.signal;

        signalElement.className =
          "signal " +
          (
            data.signal === "CALL"
              ? "call"
              : data.signal === "PUT"
                ? "put"
                : "wait"
          );

        confidenceElement.textContent =
          "Confidence: " +
          data.confidence +
          "%";

        infoElement.innerHTML =
          "Market: " +
          data.symbol +
          "<br>" +

          "Price: " +
          data.price +
          "<br>" +

          "RSI: " +
          data.rsi14 +
          "<br>" +

          "EMA 9: " +
          data.ema9 +
          "<br>" +

          "EMA 21: " +
          data.ema21 +
          "<br>" +

          "Momentum: " +
          data.momentumPercent +
          "%<br>" +

          "Candle: " +
          data.candleTime;

        updatedElement.textContent =
          "Analysis updated: " +
          new Date(data.generatedAt)
            .toLocaleString();

        status.textContent =
          "Live market analysis loaded.";

      } catch (error) {

        console.error(error);

        status.textContent =
          "Waiting for GitHub Actions to generate the first signal.";

        signalElement.textContent =
          "WAIT";

        signalElement.className =
          "signal wait";

        confidenceElement.textContent =
          "Confidence: --";

        infoElement.textContent =
          error.message;
      }
    }

    getSignal();

    setInterval(
      getSignal,
      60000
    );

  </script>

</body>

          </html>
