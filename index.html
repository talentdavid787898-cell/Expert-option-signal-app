<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Option Signal App</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
        }

        .app {
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 40px;
        }

        .signal {
            font-size: 30px;
            font-weight: bold;
            padding: 30px;
            border-radius: 15px;
            background: #2196f3;
        }

        .status {
            margin-top: 20px;
            font-size: 16px;
            color: #bbbbbb;
        }
    </style>
</head>

<body>

    <div class="app">
        <h1>Expert Option Signal App</h1>

        <div class="signal">
            WAIT FOR SIGNAL
        </div>

        <div class="status">
            Signal system is ready.
        </div>
    </div>

</body>
                                      </html>
